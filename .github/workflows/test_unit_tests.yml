name: test unit tests and sitl building

'on':
  workflow_dispatch:
    inputs:
      source_ref:
        description: Explicit manual source ref (blank uses selected workflow ref)
        type: string
        default: ''
  workflow_call:
    inputs:
      source_ref:
        description: Explicit manual source ref (blank uses selected workflow ref)
        type: string
        default: ''
      release_manifest:
        type: string
        default: ''
        description: Pinned manifest from the release gate; empty only for explicit manual builds

concurrency:
  group: ci-test_unit_tests-${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read  # checkout; jobs that save ccache add actions:write per-job

jobs:
  build:
    permissions:
      contents: read
      actions: write  # save-ccache prunes the previous cache entry
    runs-on: ubuntu-22.04
    container:
      image: ardupilot/ardupilot-dev-${{ matrix.toolchain }}:v0.2.0
      options: --user 1001
    strategy:
      fail-fast: false  # don't cancel if a job from the matrix fails
      matrix:
        toolchain: [
            base,  # GCC
            clang,
        ]
        config: [
            unit-tests,
            examples,
            sitl
        ]
    steps:
      # git checkout the PR
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: 'recursive'
      - name: Reconstruct and verify pinned release source
        if: inputs.release_manifest != ''
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: python3 .github/release_policy/policy.py materialize

      - uses: ./.github/actions/setup-ccache
        with:
          key-suffix: ${{ matrix.toolchain }}-${{ matrix.config }}
      - name: test ${{matrix.config}} ${{ matrix.toolchain }}
        env:
          CI_BUILD_TARGET: ${{matrix.config}}
        shell: 'script -q -e -c "bash {0}"'
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          if [[ ${{ matrix.toolchain }} == "clang" ]]; then
            export CC=clang
            export CXX=clang++
          fi
          PATH="/github/home/.local/bin:$PATH"
          Tools/scripts/build_ci.sh
      - uses: ./.github/actions/save-ccache
        with:
          key-suffix: ${{ matrix.toolchain }}-${{ matrix.config }}

      - name: Unittest extract_param_defaults
        env:
          PYTHONPATH: "${{ github.workspace }}/Tools/scripts:${{ github.workspace }}/modules/mavlink/pymavlink"
        if: matrix.config == 'unit-tests'
        run: |
          Tools/autotest/unittest/extract_param_defaults_unittest.py

      - name: Unittest annotate_params
        env:
          PYTHONPATH: "${{ github.workspace }}/Tools/scripts"
        if: matrix.config == 'unit-tests'
        run: |
          Tools/autotest/unittest/annotate_params_unittest.py

      - name: Archive buildlog artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
           name: fail-${{ matrix.toolchain }}-${{matrix.config}}
           path: /tmp/buildlogs
           retention-days: 14
