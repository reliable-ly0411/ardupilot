name: test scripts

'on':
  workflow_dispatch:
    inputs:
      source_ref:
        description: Explicit manual source ref (blank uses selected workflow ref)
        type: string
        default: ''
  workflow_call:
    inputs:
      source_ref:
        description: Explicit manual source ref (blank uses selected workflow ref)
        type: string
        default: ''
      release_manifest:
        type: string
        default: ''
        description: Pinned manifest from the release gate; empty only for explicit manual builds

concurrency:
  group: ci-test_scripts-${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false  # don't cancel if a job from the matrix fails
      matrix:
        config: [
            astyle-cleanliness,
            check_autotest_options,
            logger_metadata,
            param_parse,
            param-file-validation,
            python-cleanliness,
            shellcheck,
            validate_board_list,
          ]
    steps:
      # git checkout the PR
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: false
          persist-credentials: false
      - name: Reconstruct and verify pinned release source
        if: inputs.release_manifest != ''
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: python3 .github/release_policy/policy.py materialize

      - name: checkout waf submodule
        run: git submodule update --init --recursive --depth 1 modules/waf

      - name: install pip dependencies
        shell: bash
        run: |
          python3 -m pip install flake8 lxml pexpect

      - name: Install astyle
        if: matrix.config == 'astyle-cleanliness'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes astyle

      - name: test ${{matrix.config}}
        env:
          CI_BUILD_TARGET: ${{matrix.config}}
        shell: bash
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          Tools/scripts/build_ci.sh
