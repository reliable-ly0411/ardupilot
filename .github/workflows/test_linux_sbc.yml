name: test Linux SBC

'on':
  workflow_dispatch: null

concurrency:
  group: ci-test_linux_sbc-${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read  # checkout; jobs that save ccache add actions:write per-job

jobs:
  build:
    permissions:
      contents: read
      actions: write  # save-ccache prunes the previous cache entry
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-${{ matrix.toolchain }}:v0.2.0
    strategy:
      fail-fast: false  # don't cancel if a job from the matrix fails
      matrix:
        config: [
            linux,
            navigator,
            navio,
            navio2,
            bbbmini,
            bhat,
            bebop,
            erlebrain2,
            pxfmini,
            pxf,
            canzero,
        ]
        toolchain: [
            armhf,
        ]
        include:
          - config: navigator
            toolchain: armhf-musl
          - config: linux
            toolchain: base # GCC
          - config: navigator64
            toolchain: aarch64
          - config: t3-gem-o1
            toolchain: aarch64
        exclude:
          - config: navigator
            toolchain: armhf
          - config: linux
            toolchain: armhf

    steps:
      # git checkout the PR
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: ./.github/actions/setup-ccache
        with:
          key-suffix: ${{ matrix.config }}-${{ matrix.toolchain }}
      - name: test ${{matrix.config}} ${{ matrix.toolchain }}
        env:
          CI_BUILD_TARGET: ${{matrix.config}}
        shell: bash
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          if [[ ${{ matrix.toolchain }} == "clang" ]]; then
            export CC=clang
            export CXX=clang++
          fi
          PATH="/github/home/.local/bin:$PATH"
          Tools/scripts/build_ci.sh
          ccache -s
          ccache -z
      - uses: ./.github/actions/save-ccache
        with:
          key-suffix: ${{ matrix.config }}-${{ matrix.toolchain }}
