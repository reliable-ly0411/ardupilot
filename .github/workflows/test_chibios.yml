name: test chibios

'on':
  workflow_dispatch:
    inputs:
      source_ref:
        description: Explicit manual source ref (blank uses selected workflow ref)
        type: string
        default: ''
  workflow_call:
    inputs:
      source_ref:
        description: Explicit manual source ref (blank uses selected workflow ref)
        type: string
        default: ''
      release_manifest:
        type: string
        default: ''
        description: Pinned manifest from the release gate; empty only for explicit manual builds

concurrency:
  group: ci-test_chibios-${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read  # checkout; jobs that save ccache add actions:write per-job

jobs:
  build:
    permissions:
      contents: read
      actions: write  # save-ccache prunes the previous cache entry
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-${{ matrix.toolchain }}:v0.2.0
    strategy:
      fail-fast: false  # don't cancel if a job from the matrix fails
      matrix:
        config: [
            stm32f7,
            stm32h7,
            fmuv2-plane,
            periph-build,
            iofirmware,
            CubeOrange-bootloader,
            fmuv3-bootloader,
            revo-bootloader,
            stm32h7-debug,
            fmuv3,
            revo-mini,
            MatekF405-Wing,
            CubeOrange-ODID,
            CubeRedPrimary-bootloader,
            configure-all,
            build-options-defaults-test,
            signing,
            CubeOrange-PPP,
            CubeOrange-EKF2,
            SOHW,
            Pixhawk6X-PPPGW,
            new-check,
        ]
        toolchain: [
            chibios,
            #chibios-clang,
        ]
        gcc: [10]

    steps:
      # git checkout the PR
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: 'recursive'
      - name: Reconstruct and verify pinned release source
        if: inputs.release_manifest != ''
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: python3 .github/release_policy/policy.py materialize

      - uses: ./.github/actions/setup-ccache
        with:
          key-suffix: ${{ matrix.config }}-${{ matrix.toolchain }}-${{ matrix.gcc }}
      - name: test ${{matrix.config}} ${{ matrix.toolchain }} gcc-${{matrix.gcc}}
        env:
          CI_BUILD_TARGET: ${{matrix.config}}
        shell: bash
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          if [[ ${{ matrix.toolchain }} == "chibios-clang" ]]; then
            export CC=clang
            export CXX=clang++
          fi
          PATH="/usr/lib/ccache:/opt/gcc-arm-none-eabi-${{matrix.gcc}}/bin:$PATH"
          PATH="/github/home/.local/bin:$PATH"
          Tools/scripts/build_ci.sh
          ccache -s
          ccache -z
      - uses: ./.github/actions/save-ccache
        with:
          key-suffix: ${{ matrix.config }}-${{ matrix.toolchain }}-${{ matrix.gcc }}
