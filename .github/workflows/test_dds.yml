name: test dds

'on':
  workflow_dispatch: null

concurrency:
  group: ci-test_dds-${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read  # checkout; jobs that save ccache add actions:write per-job

jobs:
  build:
    permissions:
      contents: read
      actions: write  # save-ccache prunes the previous cache entry
    runs-on: ubuntu-22.04
    container:
      image: ardupilot/ardupilot-dev-ros:latest
      options: --user 1001
    strategy:
      fail-fast: false  # don't cancel if a job from the matrix fails
      matrix:
        config: [
            sitl,
            stm32h7
        ]
    steps:
      # git checkout the PR
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: ./.github/actions/setup-ccache
        with:
          key-suffix: ${{ matrix.config }}
      # install Micro-XRCE-DDS-Gen from source until image is updated
      - name: install Micro-XRCE-DDS-Gen from source
        run: |
          cd /tmp
          git clone --depth 1 --recurse-submodules --branch v4.7.1 https://github.com/ardupilot/Micro-XRCE-DDS-Gen.git
          cd Micro-XRCE-DDS-Gen
          ./gradlew assemble
      - name: test ${{matrix.config}}
        env:
          CI_BUILD_TARGET: dds-${{matrix.config}}
        shell: 'script -q -e -c "bash {0}"'
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          PATH="/github/home/.local/bin:$PATH"
          PATH="/tmp/Micro-XRCE-DDS-Gen/scripts:$PATH"
          which microxrceddsgen
          Tools/scripts/build_ci.sh
      - uses: ./.github/actions/save-ccache
        with:
          key-suffix: ${{ matrix.config }}

      - name: Archive buildlog artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
           name: ${{ github.workflow }}-fail-${{matrix.config}}
           path: /tmp/buildlogs
           retention-days: 14
