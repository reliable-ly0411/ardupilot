name: Sync upstream
on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: Sync only, or sync and inspect new formal releases
        type: choice
        options: [sync, check-releases]
        default: sync
      retry_release_id:
        description: Explicit retry of one failed release ID (no historical backfill)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: release-policy-master
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'reliable-ly0411/ardupilot'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Merge upstream without replacing local policy
        env:
          UPSTREAM: ArduPilot/ardupilot
          TARGET_BRANCH: master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --no-recurse-submodules --no-tags upstream "$TARGET_BRANCH"
          if ! git merge-base --is-ancestor "upstream/$TARGET_BRANCH" HEAD; then
            if ! git merge --no-ff --no-commit "upstream/$TARGET_BRANCH"; then
              mapfile -d '' -t conflicts < <(git diff --name-only --diff-filter=U -z)
              (( ${#conflicts[@]} > 0 )) || exit 1
              for path in "${conflicts[@]}"; do
                case "$path" in
                  .github/workflows/*|.github/release_policy/*) ;;
                  *) echo "Manual conflict resolution required: $path"; exit 1 ;;
                esac
              done
            fi
            git restore --source=HEAD --staged --worktree -- .github/workflows .github/release_policy
            git commit -m "CI: sync upstream while retaining downstream workflow policy"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
      - name: Unit-test the lightweight release detector
        run: python3 -m unittest discover -s .github/release_policy -p 'test_*.py' -v
      - name: Mirror one new formal source release (no firmware)
        id: release
        if: github.event_name == 'schedule' || inputs.action == 'check-releases'
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_ID: ${{ inputs.retry_release_id }}
        run: python3 .github/release_policy/source_mirror.py
