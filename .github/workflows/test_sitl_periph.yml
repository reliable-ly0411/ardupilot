name: test ap_periph

'on':
  workflow_dispatch: null

concurrency:
  group: ci-test_sitl_periph-${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read  # checkout; jobs that save ccache add actions:write per-job

jobs:
  build-test:
    permissions:
      contents: read
      actions: write  # save-ccache prunes the previous cache entry
    runs-on: ubuntu-22.04
    container:
      image: ardupilot/ardupilot-dev-periph:v0.2.0
      options: --privileged
    steps:
      # git checkout the PR
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: ./.github/actions/setup-ccache
        with:
          key-suffix: periph

      - name: run dronecan dsdlc generator test
        run: |
          PATH="/github/home/.local/bin:$PATH"
          python3 -m pip install --upgrade dronecan
          python3 modules/DroneCAN/dronecan_dsdlc/dronecan_dsdlc.py -O dsdlc_generated modules/DroneCAN/DSDL/uavcan modules/DroneCAN/DSDL/dronecan modules/DroneCAN/DSDL/com --run-test

      - name: build sitl_periph_universal
        shell: bash
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          PATH="/github/home/.local/bin:$PATH"
          ./waf configure --board sitl_periph_universal --debug
          ./waf build --target bin/AP_Periph
          ccache -s
          ccache -z
      - uses: ./.github/actions/save-ccache
        with:
          key-suffix: periph

      - name: test sitltest-can
        env:
          CI_BUILD_TARGET: sitltest-can
        shell: bash
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          kernel_ver=`uname -r`
          if [ "$kernel_ver" = "5.4.0-1032-azure" ] || [ "$kernel_ver" = "5.11.4-051104-generic" ]; then echo "Unsupported Kernel $kernel_ver" && exit 0; fi;
          PATH="/github/home/.local/bin:$PATH"
          Tools/scripts/build_ci.sh
