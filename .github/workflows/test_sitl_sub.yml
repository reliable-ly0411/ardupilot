name: test sub

'on':
  workflow_dispatch:
    inputs:
      source_ref:
        description: Explicit manual source ref (blank uses selected workflow ref)
        type: string
        default: ''
  workflow_call:
    inputs:
      source_ref:
        description: Explicit manual source ref (blank uses selected workflow ref)
        type: string
        default: ''
      release_manifest:
        type: string
        default: ''
        description: Pinned manifest from the release gate; empty only for explicit manual builds

concurrency:
  group: ci-test_sitl_sub-${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read  # checkout; jobs that save ccache add actions:write per-job

jobs:
  build-test:
    permissions:
      contents: read
      actions: write  # save-ccache prunes the previous cache entry
    runs-on: ubuntu-22.04
    container:
      image: ardupilot/ardupilot-dev-base:v0.2.0
      options: --privileged --cap-add=SYS_PTRACE --security-opt apparmor=unconfined --security-opt seccomp=unconfined

    steps:
      # git checkout the PR
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: 'recursive'
      - name: Reconstruct and verify pinned release source
        if: inputs.release_manifest != ''
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: python3 .github/release_policy/policy.py materialize

      - name: Register gcc problem matcher
        run: echo "::add-matcher::.github/problem-matchers/gcc.json"

      - name: Register python problem matcher
        run: echo "::add-matcher::.github/problem-matchers/python.json"

      - name: Register autotest warn matcher
        run: echo "::add-matcher::.github/problem-matchers/autotestwarn.json"

      - name: Register autotest fail matcher
        run: echo "::add-matcher::.github/problem-matchers/autotestfail.json"

      - uses: ./.github/actions/setup-ccache
        with:
          key-suffix: base
      - name: build sub
        shell: bash
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          PATH="/github/home/.local/bin:$PATH"
          ./waf configure --board sitl --debug
          ./waf build --target bin/ardusub
          ccache -s
          ccache -z
      - uses: ./.github/actions/save-ccache
        with:
          key-suffix: base
      - name: test sitltest-sub
        env:
          CI_BUILD_TARGET: sitltest-sub
        shell: bash
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          PATH="/github/home/.local/bin:$PATH"
          Tools/scripts/build_ci.sh

      - name: Archive buildlog artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
           name: ${{ github.workflow }}-fail-sitltest-sub
           path: |
             /tmp/buildlogs
             /__w/ardupilot/ardupilot/logs
             /__w/ardupilot/ardupilot/ap-*.core
             /__w/ardupilot/ardupilot/core.*
             /__w/ardupilot/ardupilot/dumpstack.sh_*
             /__w/ardupilot/ardupilot/dumpcore.sh_*
           retention-days: 14

      - name: Archive .bin artifacts
        uses: actions/upload-artifact@v7
        with:
           name: ${{ github.workflow }}-BIN-sitltest-sub
           path: /__w/ardupilot/ardupilot/logs
           retention-days: 7

